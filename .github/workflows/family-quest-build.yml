name: Family Quest build check
on:
  push:
    branches: ['chatgpt/**']
    paths: ['family-quest/**', '.github/workflows/family-quest-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-quest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
