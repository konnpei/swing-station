<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>まいにちクエスト</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#12483B" />
<style>
  :root{
    --bg:#EAF3F2; --card:#FFFFFF; --paper:#F3FAF9; --ink:#173D3A; --sub:#5C7A77;
    --seal:#1D7A8C; --seal-dark:#125866; --teal:#1D9E75; --teal-dark:#0F6E56;
    --border:#D8ECE9; --border-strong:#BFDFDA; --warn:#8A5A16; --warn-bg:#F6E8CE;
    --wrong:#B23B2E; --wrong-bg:#FBEAE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Kaku Gothic ProN","Zen Kaku Gothic New",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center; min-height:100vh;
  }
  .phone{width:100%; max-width:420px; padding:16px;}
  .card{
    background:var(--card); border-radius:26px; padding:26px 22px 28px; min-height:80vh;
    display:flex; flex-direction:column;
    box-shadow:0 1px 2px rgba(23,61,58,0.06), 0 10px 30px rgba(23,61,58,0.09);
    border:1px solid var(--border);
  }
  .screen{display:none; flex-direction:column; flex:1;}
  .screen.active{display:flex;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .gear{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border-strong); background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:15px;
  }
  .eyebrow{font-size:12.5px; color:var(--sub); margin:0 0 5px; letter-spacing:0.06em;}
  h1{font-size:21px; margin:0 0 10px; font-weight:700; color:var(--ink); position:relative; padding-bottom:12px;}
  h1::after{content:""; position:absolute; left:0; bottom:0; width:40px; height:2px; background:linear-gradient(90deg, var(--seal), transparent);}
  select{width:100%; font-size:15px; padding:12px; border-radius:12px; border:1px solid var(--border-strong); font-family:inherit; background:var(--paper); color:var(--ink); margin-bottom:12px;}
  button{font-family:inherit; border-radius:12px; border:1px solid var(--border-strong); background:transparent; font-size:14.5px; padding:12px; cursor:pointer; color:var(--ink); transition:background 0.15s ease;}
  button:hover{background:var(--paper);}
  button:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal); color:#fff; border:none; font-size:17px; font-weight:700; height:56px; margin-top:auto; border-radius:999px; box-shadow:0 6px 16px rgba(29,158,117,0.28);}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-plain{margin-top:10px; height:44px; border-radius:999px;}
  .center{text-align:center; align-items:center; justify-content:center;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--border); font-size:14px; gap:8px;}
  .staff-add-row{display:none; gap:8px; margin:-8px 0 12px;}
  .staff-add-row input{flex:1; font-size:14px; padding:9px 10px; border-radius:10px; border:1px solid var(--border-strong); font-family:inherit; background:var(--paper); color:var(--ink);}
  .progress{font-size:12px; color:var(--sub); margin-bottom:8px;}
  .q-card{background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:26px 18px; text-align:center; margin-bottom:18px;}
  .q-kanji{font-size:56px; font-weight:700; line-height:1;}
  .q-math{font-size:34px; font-weight:700; letter-spacing:2px;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choices.stacked{grid-template-columns:1fr;}
  .choice-btn{padding:16px 8px; border-radius:12px; font-size:17px; font-weight:700; background:var(--card); border:1.5px solid var(--border-strong);}
  .choice-btn.stacked-btn{padding:14px 16px; font-size:13.5px; font-weight:600; text-align:left; line-height:1.5;}
  .choice-btn.correct{background:var(--paper); border-color:var(--teal); color:var(--teal-dark);}
  .choice-btn.wrong{background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong);}
  .choice-btn:disabled{cursor:default;}
  .circle{
    width:104px; height:104px; border-radius:50%; border:3px solid var(--teal); color:var(--teal-dark);
    display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:22px;
    font-size:30px; font-weight:800; box-shadow:0 4px 12px rgba(29,158,117,0.2);
  }
  .stars-icons{display:flex; gap:2px; font-size:18px; letter-spacing:1px; justify-content:center; margin-bottom:6px;}
  .star-on{color:var(--seal);}
  .star-off{color:var(--border-strong);}
  .points-pill{font-size:11.5px; font-weight:700; background:var(--paper); color:var(--sub); border:1px solid var(--border); padding:4px 11px; border-radius:999px; white-space:nowrap;}
  .swatches{display:flex; gap:14px; margin:6px 0 22px; flex-wrap:wrap;}
  .swatch{width:48px; height:48px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,0.12);}
  .swatch.active{border-color:var(--ink);}
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-nav button{padding:6px 14px; font-size:14px; border-radius:999px;}
  .cal-month-label{font-size:15px; font-weight:700; color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-dow{font-size:11px; color:var(--sub); text-align:center; padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1; min-width:0; overflow:hidden; border-radius:10px; border:1px solid var(--border);
    background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; font-size:11px; color:var(--sub);
  }
  .cal-cell.empty{border:none; background:transparent;}
  .cal-cell.has-record{border-color:var(--border-strong); cursor:pointer;}
  .cal-day{font-size:10px; color:var(--sub); position:absolute; top:3px; left:5px;}
  .cal-score{font-size:14px; font-weight:700; color:var(--teal);}
  .dots{display:flex; justify-content:center; gap:8px; margin-top:14px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--border-strong);}
  .dot.active{background:var(--teal);}
  .offline-note{font-size:11.5px; color:var(--sub); text-align:center; margin-top:10px;}
  .sub-note{font-size:11.5px; color:var(--sub); line-height:1.6; margin:0 0 10px;}
  .battle-hud{display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:12px 14px; margin-bottom:14px;}
  .battle-monster{font-size:38px; line-height:1; flex-shrink:0; position:relative;}
  .battle-info{flex:1; min-width:0;}
  .battle-name{font-size:12px; font-weight:700; color:var(--ink); margin-bottom:5px;}
  .hp-pips{display:flex; gap:3px; margin-bottom:5px;}
  .hp-pip{width:18px; height:8px; border-radius:4px; background:var(--border-strong);}
  .hp-pip.filled{background:var(--wrong);}
  .hearts-row{font-size:13px; letter-spacing:1px; display:inline-block; position:relative;}

  .mark-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:110px; line-height:1; pointer-events:none; opacity:0;
  }
  .mark-overlay.show{ animation:markPop 850ms ease forwards; }
  .mark-overlay.correct{ color:#1D9E75; text-shadow:0 4px 18px rgba(29,158,117,0.5); }
  .mark-overlay.wrong{ color:#B23B2E; text-shadow:0 4px 18px rgba(178,59,46,0.45); }
  @keyframes markPop{
    0%{ transform:scale(0.4); opacity:0; }
    30%{ transform:scale(1.18); opacity:1; }
    55%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
  }

  /* 正解=プレイヤーの攻撃がモンスターに当たる演出 */
  .battle-monster.hit{ animation:monsterHit 480ms ease; }
  @keyframes monsterHit{
    0%{ transform:translateX(0) scale(1); filter:none; }
    15%{ transform:translateX(-9px) scale(0.96); }
    30%{ transform:translateX(8px) scale(1.04); filter:brightness(2.2) saturate(0); }
    45%{ transform:translateX(-6px) scale(0.98); filter:brightness(1.4) saturate(0.3); }
    60%{ transform:translateX(5px); filter:none; }
    80%{ transform:translateX(-2px); }
    100%{ transform:translateX(0) scale(1); filter:none; }
  }
  /* 不正解=モンスターがプレイヤーへ攻撃を放つ演出(震えではなく踏み込み) */
  .battle-monster.attack{ animation:monsterAttack 480ms ease; }
  @keyframes monsterAttack{
    0%{ transform:scale(1) rotate(0deg); }
    25%{ transform:scale(1.3) rotate(-6deg); }
    45%{ transform:scale(1.32) rotate(4deg); }
    70%{ transform:scale(1.1) rotate(-2deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .fx-pop{
    position:absolute; top:-8px; right:-12px; font-size:22px; font-weight:800; pointer-events:none;
    animation:floatUp 750ms ease forwards; z-index:2;
  }
  .fx-pop-hearts{ top:-22px; right:-4px; font-size:17px; }
  @keyframes floatUp{
    0%{ transform:translateY(0) scale(0.6); opacity:0; }
    18%{ opacity:1; transform:translateY(-4px) scale(1.25); }
    100%{ transform:translateY(-36px) scale(1); opacity:0; }
  }
  .hearts-row.shake{ animation:heartsShake 420ms ease; }
  @keyframes heartsShake{
    0%,100%{ transform:translateX(0) scale(1); }
    20%{ transform:translateX(-6px) scale(1.1); }
    40%{ transform:translateX(6px) scale(1.1); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce){
    .mark-overlay.show, .battle-monster.hit, .battle-monster.attack, .fx-pop, .hearts-row.shake{ animation:none !important; }
  }
  .explain-box{ margin-top:12px; background:var(--wrong-bg); border:1px solid var(--wrong); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--wrong); line-height:1.6; }
  .rpg-box{background:var(--paper); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:left; width:100%;}
  .rpg-box-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .exp-bar{background:var(--border); border-radius:999px; height:8px; overflow:hidden;}
  .exp-bar-fill{background:var(--teal); height:100%;}
  .dex-item{width:64px; text-align:center; padding:8px 4px; border-radius:12px; border:1px solid var(--border); background:var(--paper);}
</style>
</head>
<body>
<div class="phone">
  <div class="card">

    <section id="screen-home" class="screen active">
      <div class="topbar">
        <div>
          <p class="eyebrow">まいにち5分</p>
          <h1 style="margin-bottom:0; padding-bottom:0;">クエスト</h1>
        </div>
        <div class="gear" onclick="showSettings()">⚙</div>
      </div>

      <p class="eyebrow" style="margin-top:14px;">だれがやる？</p>
      <select id="staffSelect" onchange="handleStaffChange()"></select>
      <div class="staff-add-row" id="staffAddRow">
        <input id="staffAddInput" type="text" placeholder="なまえを入力" onkeydown="if(event.key==='Enter') confirmAddStaff();" />
        <button onclick="confirmAddStaff()" style="width:56px; flex-shrink:0;">追加</button>
      </div>
      <div class="stars-icons" id="starsRow"></div>
      <p class="sub-note" id="levelNote" style="margin-top:-2px;"></p>

      <p class="eyebrow" style="margin-top:10px;">がくねん</p>
      <select id="gradeSelect"></select>
      <p class="sub-note" id="gradeHiddenNote" style="display:none; margin-top:-8px;">株用語は学年に関係ない共通問題です</p>

      <p class="eyebrow" style="margin-top:2px;">きょうか</p>
      <select id="subjectSelect" onchange="handleSubjectChange()">
        <option value="kanji">漢字</option>
        <option value="math">算数</option>
        <option value="english">英語</option>
        <option value="stockterms">株用語</option>
      </select>

      <button class="btn-primary" onclick="startQuiz()">はじめる(5問)</button>
      <button class="btn-plain" onclick="showHistory()">記録一覧を見る</button>
      <p class="offline-note" id="netStatus"></p>
    </section>

    <section id="screen-quiz" class="screen">
      <p class="progress" id="quizProgress"></p>
      <div class="battle-hud" id="battleHud"></div>
      <div class="q-card" id="quizQuestionArea" style="position:relative;">
        <div id="quizQuestionContent"></div>
        <div class="mark-overlay" id="markOverlay"></div>
      </div>
      <div class="choices" id="quizChoices"></div>
      <div class="explain-box" id="explainBox" style="display:none;"></div>
      <button class="btn-primary" id="nextBtn" style="display:none; height:48px; margin-top:10px;" onclick="advanceQuiz()">次へ →</button>
    </section>

    <section id="screen-result" class="screen center">
      <div class="circle" id="resultCircle"></div>
      <p style="font-size:18px;font-weight:700;margin:0 0 8px;" id="resultLabel"></p>
      <p style="font-size:13px;color:var(--sub);margin:0 0 14px;" id="streakLabel"></p>
      <div style="margin-bottom:10px;">
        <div class="stars-icons" id="starsRowDone"></div>
        <div style="text-align:center;"><span class="points-pill" id="pointsDone"></span></div>
      </div>
      <div id="rpgResultBox" style="margin-bottom:14px;"></div>
      <button class="btn-plain" style="width:100%;" onclick="showScreen('home')">もういちどトップへ →</button>
    </section>

    <section id="screen-history" class="screen">
      <p class="eyebrow">記録一覧</p>
      <h1>これまでの記録</h1>
      <div id="historyCalendar" style="margin-bottom:18px;"></div>
      <div id="historyList"></div>
      <button class="btn-plain" onclick="showScreen('home')">トップに戻る</button>
    </section>

    <section id="screen-settings" class="screen">
      <p class="eyebrow">設定</p>
      <h1>デザインを選ぶ</h1>
      <p class="eyebrow" style="margin-top:0;">既定の配色</p>
      <div class="swatches" id="themeSwatches"></div>
      <p class="eyebrow" style="margin-top:8px;">こどもごとの配色</p>
      <div id="staffThemeList" style="margin-bottom:6px;"></div>
      <p class="eyebrow" style="margin-top:12px;">こどもごとのポイント</p>
      <div id="staffPointsList"></div>
      <p class="eyebrow" style="margin-top:12px;">モンスター図鑑</p>
      <p class="sub-note" style="margin-top:-4px;">トップで選んでいるこどもの図鑑です。テストでモンスターをたおすと記録されます。</p>
      <div id="monsterDex" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px;"></div>
      <p class="eyebrow" style="margin-top:12px;">データのバックアップ</p>
      <p class="sub-note">データは端末内にのみ保存されています。機種変更やブラウザのデータ消去に備えて、定期的にバックアップをおすすめします。</p>
      <div style="display:flex; gap:8px; margin-bottom:6px;">
        <button onclick="exportData()" style="flex:1;">📤 エクスポート</button>
        <button onclick="document.getElementById('importFileInput').click()" style="flex:1;">📥 インポート</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportFile(event)" />
      <p class="eyebrow" style="margin-top:12px;">ほかのアプリ</p>
      <a href="../swing-trade-app/" style="display:block; text-align:center; text-decoration:none; color:var(--teal); font-size:13px; padding:12px; border:1px solid var(--border-strong); border-radius:12px; margin-bottom:6px;">📈 スイングトレード チェックへ</a>
      <button class="btn-plain" onclick="showScreen('home')">戻る</button>
    </section>

    <div class="dots">
      <span class="dot active" id="dot-home"></span>
      <span class="dot" id="dot-quiz"></span>
      <span class="dot" id="dot-result"></span>
      <span class="dot" id="dot-history"></span>
    </div>
  </div>
</div>

<script>
const DB_NAME = "studyQuizAppDB", STORE = "records", SETTINGS = "settings";

const GRADES = [
  { key: "g1", label: "小学1年生" },
  { key: "g2", label: "小学2年生" },
  { key: "g3", label: "小学3年生" },
  { key: "g4", label: "小学4年生" },
  { key: "g5", label: "小学5年生" },
  { key: "g6", label: "小学6年生" },
  { key: "j1", label: "中学1年生" },
  { key: "j2", label: "中学2年生" },
  { key: "j3", label: "中学3年生" }
];

// 小学生は教育漢字から単独字カードとして読みが分かりやすいものを抜粋。
// 中学生(j1〜j3)は単漢字ではなく、社会・経済系の二字熟語にしている
// (中学漢字は単独字より熟語の読みが学習の中心になるため)。
// 学年を追加する場合はここにキーを増やすだけでよい。
const KANJI_BANK = {

    ["一","いち"],["二","に"],["三","さん"],["四","し"],["五","ご"],
    ["六","ろく"],["七","しち"],["八","はち"],["九","きゅう"],["十","じゅう"],
    ["日","ひ"],["月","つき"],["水","みず"],["木","き"],["山","やま"]
  ],
  g2: [
    ["春","はる"],["夏","なつ"],["秋","あき"],["冬","ふゆ"],["東","ひがし"],
    ["西","にし"],["南","みなみ"],["北","きた"],["友","とも"],["兄","あに"],
    ["姉","あね"],["弟","おとうと"],["妹","いもうと"],["数","かず"],["何","なに"]
  ],
  g3: [
    ["去","きょ"],["急","きゅう"],["級","きゅう"],["球","きゅう"],["銀","ぎん"],
    ["区","く"],["苦","く"],["具","ぐ"],["君","くん"],["係","けい"],
    ["軽","けい"],["血","けつ"],["決","けつ"],["研","けん"],["県","けん"]
  ],
  g4: [
    ["愛","あい"],["完","かん"],["官","かん"],["管","かん"],["観","かん"],
    ["願","がん"],["希","き"],["旗","き"],["器","き"],["機","き"],
    ["議","ぎ"],["求","きゅう"],["泣","きゅう"],["給","きゅう"],["挙","きょ"]
  ],
  g5: [
    ["圧","あつ"],["因","いん"],["営","えい"],["衛","えい"],["易","えき"],
    ["益","えき"],["演","えん"],["応","おう"],["恩","おん"],["可","か"],
    ["仮","か"],["価","か"],["河","か"],["過","か"],["賀","が"]
  ],
  g6: [
    ["異","い"],["遺","い"],["域","いき"],["宇","う"],["映","えい"],
    ["延","えん"],["沿","えん"],["我","が"],["灰","かい"],["拡","かく"],
    ["革","かく"],["閣","かく"],["割","かつ"],["株","かぶ"],["干","かん"]

  j1: [
    ["経済","けいざい"],["政治","せいじ"],["歴史","れきし"],["文化","ぶんか"],["環境","かんきょう"],
    ["技術","ぎじゅつ"],["産業","さんぎょう"],["貿易","ぼうえき"],["資源","しげん"],["人口","じんこう"],
    ["気候","きこう"],["地形","ちけい"],["憲法","けんぽう"],["権利","けんり"],["義務","ぎむ"]
  ],
  j2: [
    ["経営","けいえい"],["投資","とうし"],["需要","じゅよう"],["供給","きょうきゅう"],["競争","きょうそう"],
    ["独占","どくせん"],["労働","ろうどう"],["賃金","ちんぎん"],["税金","ぜいきん"],["予算","よさん"],
    ["財政","ざいせい"],["為替","かわせ"],["物価","ぶっか"],["景気","けいき"],["不況","ふきょう"]
  ],
  j3: [
    ["国会","こっかい"],["内閣","ないかく"],["裁判","さいばん"],["選挙","せんきょ"],["民主","みんしゅ"],
    ["主権","しゅけん"],["平和","へいわ"],["条約","じょうやく"],["国際","こくさい"],["連合","れんごう"],
    ["資本","しほん"],["株式","かぶしき"],["金融","きんゆう"],["企業","きぎょう"],["貯蓄","ちょちく"]
  ]

// 英単語(英語→意味)。学年が上がるほど語彙レベルを上げている。
const ENGLISH_BANK = {
  g1: [
    ["apple","りんご"],["cat","ねこ"],["dog","いぬ"],["sun","たいよう"],["book","ほん"],
    ["red","あか"],["blue","あお"],["big","おおきい"],["small","ちいさい"],["happy","うれしい"],
    ["run","はしる"],["eat","たべる"]
  ],
  g2: [
    ["banana","バナナ"],["elephant","ぞう"],["school","がっこう"],["friend","ともだち"],["family","かぞく"],
    ["morning","あさ"],["night","よる"],["water","みず"],["fish","さかな"],["bird","とり"],
    ["walk","あるく"],["sing","うたう"]
  ],
  g3: [

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
      if(!d.objectStoreNames.contains(SETTINGS)) d.createObjectStore(SETTINGS, { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getSetting(key){
  return new Promise((resolve) => {
    const tx = db.transaction(SETTINGS, "readonly");
    const req = tx.objectStore(SETTINGS).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
  });
}

function putSetting(key, value){
  return new Promise((resolve) => {
    const tx = db.transaction(SETTINGS, "readwrite");
    tx.objectStore(SETTINGS).put({ key, value });
    tx.oncomplete = () => resolve();
  });
}

function getAllRecords(){
  return new Promise((resolve) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
  });
}

}

function rnd(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }

function numQ(display, ans, allowNegative){
  return { display, ans, choices: mathChoices(ans, allowNegative), explain: display+" = "+ans };
}

function mathChoices(correct, allowNegative){
  const set = new Set([correct]);
  const deltas = [1,-1,2,-2,3,-3,5,-5,10,-10];
  let i = 0;
  while(set.size < 4 && i < deltas.length){
    const v = correct + deltas[i];
    if(allowNegative || v >= 0) set.add(v);
    i++;
  }
  while(set.size < 4) set.add(correct + rnd(1,20) * (allowNegative && Math.random() < 0.5 ? -1 : 1));
  return shuffle([...set]);
}

function fractionChoices(correctN, d){
  const set = new Set([correctN]);
  const deltas = [1,-1,2,-2,3,-3];
  let i = 0;
  while(set.size < 4 && i < deltas.length){
    const v = correctN + deltas[i];
    if(v >= 1 && v < d) set.add(v);
    i++;
  }
  while(set.size < 4) set.add(rnd(1, Math.max(2,d-1)));
  return shuffle([...set]).map(n => n+"/"+d);
}

function fractionDenomChoices(correctD){
  const set = new Set([correctD]);
  const deltas = [1,-1,2,-2,3,-3];
  let i = 0;
  while(set.size < 4 && i < deltas.length){
    const v = correctD + deltas[i];
    if(v >= 2) set.add(v);
    i++;
  }
  while(set.size < 4) set.add(correctD + rnd(1,6));
  return shuffle([...set]).map(dd => "1/"+dd);
}

function genMathProblem(gradeKey){
  switch(gradeKey){
    case "g1": {
      if(Math.random() < 0.5){ const a=rnd(1,15), b=rnd(1,20-a); return numQ(a+" + "+b, a+b); }
      const a=rnd(1,20), b=rnd(0,a); return numQ(a+" − "+b, a-b);
    }
    case "g2": {
      const r = Math.random();
      if(r < 0.34){ const a=rnd(10,80), b=rnd(10,99-a); return numQ(a+" + "+b, a+b); }
      if(r < 0.67){ const a=rnd(20,99), b=rnd(0,a); return numQ(a+" − "+b, a-b); }
      const a=rnd(1,9), b=rnd(1,9); return numQ(a+" × "+b, a*b);
    }
    case "g3": {
      const r = Math.random();
      if(r < 0.3){ const a=rnd(1,12), b=rnd(1,9); return numQ(a+" × "+b, a*b); }
      if(r < 0.55){ const b=rnd(1,9), ansv=rnd(1,9); return numQ((b*ansv)+" ÷ "+b, ansv); }
      if(r < 0.78){ const a=rnd(100,800), b=rnd(100,999-a); return numQ(a+" + "+b, a+b); }
      const a=rnd(200,999), b=rnd(0,a); return numQ(a+" − "+b, a-b);
    }
    case "g4": {
      const r = Math.random();
      if(r < 0.34){
        const ai=rnd(10,80), bi=rnd(10,95-ai);
        return numQ((ai/10).toFixed(1)+" + "+(bi/10).toFixed(1), Math.round(ai+bi)/10);
      }
      if(r < 0.67){
        const ai=rnd(20,99), bi=rnd(0,ai);
        return numQ((ai/10).toFixed(1)+" − "+(bi/10).toFixed(1), Math.round(ai-bi)/10);
      }
      const a=rnd(11,30), b=rnd(2,9); return numQ(a+" × "+b, a*b);
    }
    case "g5": {
      const r = Math.random();
      if(r < 0.4){
        const d=rnd(5,9), n1=rnd(1,d-2), n2=rnd(1,d-n1-1);
        const ansN=n1+n2;
        return { display:n1+"/"+d+" + "+n2+"/"+d, ans:ansN+"/"+d, choices:fractionChoices(ansN,d), explain:n1+"/"+d+" + "+n2+"/"+d+" = "+ansN+"/"+d };
      }
      const base=rnd(2,20)*10, pct=[10,20,25,50,75][rnd(0,4)];
      const ans=Math.round(base*pct/100);
      return { display:base+"の"+pct+"%は?", ans, choices:mathChoices(ans), explain:base+" × "+pct+"% = "+ans };
    }
    case "g6": {
      const r = Math.random();
      if(r < 0.4){
        const a=rnd(2,6), b=rnd(2,6), d=a*b;
        return { display:"1/"+a+" × 1/"+b, ans:"1/"+d, choices:fractionDenomChoices(d), explain:"1/"+a+" × 1/"+b+" = 1/"+d };
      }
      const avg=rnd(10,30), d1=rnd(-4,4), d2=rnd(-4,4);
      const n1=avg+d1, n2=avg+d2, n3=avg-d1-d2;
      return { display:n1+", "+n2+", "+n3+"の平均は?", ans:avg, choices:mathChoices(avg), explain:"("+n1+" + "+n2+" + "+n3+") ÷ 3 = "+avg };
    }
    case "j1": {
      const r = Math.random();
      if(r < 0.34){ const a=rnd(-10,10), b=rnd(-10,10); return numQ(a+" + "+b, a+b, true); }
      if(r < 0.67){ const a=rnd(-9,9), b=rnd(-9,9); return numQ(a+" × "+b, a*b, true); }
      const a=rnd(1,15), x=rnd(-10,15), b=x+a;
      return { display:"x + "+a+" = "+b+"、xは?", ans:x, choices:mathChoices(x,true), explain:"x = "+b+" − "+a+" = "+x };
    }
    case "j2": {
      const r = Math.random();
      if(r < 0.5){
        const a=rnd(2,6), x=rnd(-10,15), b=rnd(-10,10);
        const c=a*x+b;
        const bStr = b>=0 ? " + "+b : " − "+Math.abs(b);
        return { display:a+"x"+bStr+" = "+c+"、xは?", ans:x, choices:mathChoices(x,true), explain:"x = "+x+" を代入: "+a+"×"+x+bStr+" = "+c };
      }
      const a=rnd(-8,8), b=rnd(-8,8); return numQ(a+" × "+b, a*b, true);
    }
    default: { // j3
      const r = Math.random();
      if(r < 0.4){
        const a=rnd(2,9), x=rnd(-12,12), b=rnd(0,15);
        const c=a*x-b;
        return { display:a+"x − "+b+" = "+c+"、xは?", ans:x, choices:mathChoices(x,true), explain:"x = "+x+" を代入: "+a+"×"+x+" − "+b+" = "+c };
      }
      if(r < 0.7){
        const x=rnd(2,12), sq=x*x;
        return { display:"x² = "+sq+"、xは?(正の数)", ans:x, choices:mathChoices(x), explain:"x = "+x+" を代入: "+x+"×"+x+" = "+sq };
      }
      const a=rnd(-12,12), b=rnd(-12,12); return numQ(a+" − "+b, a-b, true);
    }
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildWordQuestions(bank, type){
  const picks = shuffle(bank).slice(0, 5);
  // 同じ読み/意味を持つ項目が複数あると(例:急・球・級=きゅう)、選択肢の
  // 重複につながるため、重複除去した候補プールから引く。
  const uniqueMeanings = [...new Set(bank.map(k => k[1]))];
  return picks.map(([word, meaning]) => {
    const distractors = shuffle(uniqueMeanings.filter(m => m !== meaning)).slice(0, 3);
    const choices = shuffle([meaning, ...distractors]);
    const explain = type === "kanji" ? word+"の読みは「"+meaning+"」です"
      : type === "english" ? "「"+word+"」は「"+meaning+"」という意味です"
      : "「"+word+"」= "+meaning;
    return { type, display: word, ans: meaning, choices, explain };
  });
}

function buildQuestions(gradeKey, subject){
  if(subject === "kanji"){
    return buildWordQuestions(KANJI_BANK[gradeKey] || KANJI_BANK.g1, "kanji");
  }
  if(subject === "english"){
    return buildWordQuestions(ENGLISH_BANK[gradeKey] || ENGLISH_BANK.g1, "english");
  }
  if(subject === "stockterms"){
    return buildWordQuestions(STOCKTERMS_BANK, "stockterm");
  }
  const qs = [];
  for(let i = 0; i < 5; i++){
    const p = genMathProblem(gradeKey);
    qs.push({ type: "math", display: p.display, ans: p.ans, choices: p.choices, explain: p.explain });
  }
  return qs;
}

async function startQuiz(){
  const staff = currentStaffName();
  if(!staff){ alert("だれがやるか選んでください(なければ「+新しい名前を追加」)"); return; }
  const grade = document.getElementById("gradeSelect").value;
  const subject = document.getElementById("subjectSelect").value;
  const questions = buildQuestions(grade, subject);
  const rpg = await getRpgData(staff);
  const monster = pickMonster(rpg.level);
  currentQuiz = { staff, grade, subject, questions, index: 0, correct: 0, monster, monsterHp: questions.length, hearts: 3 };
  showScreen("quiz");
  renderQuestion();
}

function renderBattleHud(){
  const hud = document.getElementById("battleHud");
  if(!hud) return;
  const q = currentQuiz;
  if(!q.monster){ hud.innerHTML = ""; return; }
  const total = q.questions.length;
  let pips = "";
  for(let i = 0; i < total; i++){
    pips += '<span class="hp-pip'+(i < q.monsterHp ? " filled" : "")+'"></span>';
  }
  let hearts = "";
  for(let i = 0; i < 3; i++){
    hearts += i < q.hearts ? "❤️" : "🤍";
  }
  hud.innerHTML =
    '<div class="battle-monster">'+q.monster.emoji+'</div>'
    + '<div class="battle-info">'
    +   '<div class="battle-name">'+q.monster.name+'</div>'
    +   '<div class="hp-pips">'+pips+'</div>'
    +   '<div class="hearts-row">'+hearts+'</div>'
    + '</div>';
}

function renderQuestion(){
  renderBattleHud();
  document.getElementById("markOverlay").className = "mark-overlay";
  hideExplain();
  const q = currentQuiz.questions[currentQuiz.index];
  document.getElementById("quizProgress").textContent = (currentQuiz.index+1)+" / "+currentQuiz.questions.length+"問";
  const area = document.getElementById("quizQuestionContent");
  if(q.type === "kanji"){
    area.innerHTML = '<div class="q-kanji">'+q.display+'</div><div style="font-size:12px;color:var(--sub);margin-top:10px;">読み方はどれ?</div>';
  } else if(q.type === "english"){
    area.innerHTML = '<div class="q-kanji" style="font-size:32px;">'+q.display+'</div><div style="font-size:12px;color:var(--sub);margin-top:10px;">意味はどれ?</div>';
  } else if(q.type === "stockterm"){
    area.innerHTML = '<div class="q-kanji" style="font-size:24px;">'+q.display+'</div><div style="font-size:12px;color:var(--sub);margin-top:10px;">説明はどれ?</div>';
  } else {
    const text = q.display.indexOf("?") >= 0 ? q.display : q.display+' = ?';
    area.innerHTML = '<div class="q-math">'+text+'</div>';
  }
  const stacked = q.type === "stockterm";
  const choicesEl = document.getElementById("quizChoices");
  choicesEl.className = "choices" + (stacked ? " stacked" : "");
  choicesEl.innerHTML = q.choices.map((c,i) =>
    '<button class="choice-btn'+(stacked ? " stacked-btn" : "")+'" onclick="answerQuiz('+i+')">'+c+'</button>'
  ).join("");
}

function answerQuiz(i){
  const q = currentQuiz.questions[currentQuiz.index];
  const chosen = q.choices[i];
  const buttons = document.querySelectorAll("#quizChoices .choice-btn");
  buttons.forEach(b => b.disabled = true);
  const isCorrect = chosen === q.ans;
  if(isCorrect){
    currentQuiz.correct++;
    currentQuiz.monsterHp = Math.max(0, currentQuiz.monsterHp - 1);
    buttons[i].classList.add("correct");
  } else {
    currentQuiz.hearts = Math.max(0, currentQuiz.hearts - 1);
    buttons[i].classList.add("wrong");
    buttons.forEach((b,bi) => { if(q.choices[bi] === q.ans) b.classList.add("correct"); });
  }
  renderBattleHud();
  playAnswerFx(isCorrect);
  if(isCorrect){
    setTimeout(advanceQuiz, 900);
  } else {
    if(q.explain) showExplain(q.explain);
    showNextButton();
  }
}

function advanceQuiz(){
  hideExplain();
  currentQuiz.index++;
  if(currentQuiz.index < currentQuiz.questions.length) renderQuestion();
  else finishQuiz();
}

// isCorrect=true: プレイヤーの攻撃がモンスターに命中する演出(モンスターがhitで震える+💥)
// isCorrect=false: モンスターがプレイヤーへ攻撃を放つ演出(モンスターはattackで踏み込み、
// ダメージ表現(💢+シェイク)はハート側に出す。モンスター側にダメージ演出を出さない)
function playAnswerFx(isCorrect){
  const mark = document.getElementById("markOverlay");
  mark.textContent = isCorrect ? "⭕️" : "❌";
  mark.className = "mark-overlay " + (isCorrect ? "correct" : "wrong");
  void mark.offsetWidth;
  mark.classList.add("show");

  const monster = document.querySelector("#battleHud .battle-monster");
  if(monster){
    monster.classList.remove("hit", "attack");
    void monster.offsetWidth;
    monster.classList.add(isCorrect ? "hit" : "attack");
    if(isCorrect){
      const fx = document.createElement("span");
      fx.className = "fx-pop";
      fx.textContent = "💥";
      monster.appendChild(fx);
      setTimeout(() => fx.remove(), 750);
    }
  }
  if(!isCorrect){
    const hearts = document.querySelector("#battleHud .hearts-row");
    if(hearts){
      hearts.classList.remove("shake");
      void hearts.offsetWidth;
      hearts.classList.add("shake");
      const fx = document.createElement("span");
      fx.className = "fx-pop fx-pop-hearts";
      fx.textContent = "💢";
      hearts.appendChild(fx);
      setTimeout(() => fx.remove(), 750);
    }
  }
}

function showExplain(text){
  const box = document.getElementById("explainBox");
  box.textContent = "💡 " + text;
  box.style.display = "block";
}

function showNextButton(){
  document.getElementById("nextBtn").style.display = "block";
}

function hideExplain(){
  document.getElementById("explainBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
}

async function finishQuiz(){
  const { staff, grade, subject, correct, questions, monster } = currentQuiz;
  const total = questions.length;
  const passed = correct === total;
  const monsterDefeated = correct >= Math.ceil(total * 0.6);
  const date = todayStr();
  const record = { id: staff+"__"+subject+"__"+date+"__"+Date.now(), staff, grade, subject, date, correct, total, savedAt: new Date().toISOString() };

  const tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).put(record);
  await new Promise(res => tx.oncomplete = res);

  const streak = await computeStreak(staff);
  document.getElementById("resultCircle").textContent = correct+"/"+total;
  document.getElementById("resultLabel").textContent =
    passed ? "ぜんもんせいかい！すごい！" : correct >= total*0.6 ? "よくできました！" : "またちょうせんしよう！";
  document.getElementById("streakLabel").textContent = streak > 0 ? "連続"+streak+"日、記録できています" : "";

  const starsData = await addStarIfPassed(passed, staff);
  await renderStars("starsRowDone", starsData);
  document.getElementById("pointsDone").textContent = "ポイント "+starsData.points+"pt";

  if(monster) await applyRpgResult(staff, monster, correct, monsterDefeated, passed);
  await refreshStarsRow();

  showScreen("result");
}

async function applyRpgResult(staff, monster, correct, monsterDefeated, passed){
  const rpg = await getRpgData(staff);
  let expGain = correct * 8;
  if(passed) expGain += 20;
  rpg.exp += expGain;
  let leveledUp = false;
  while(rpg.exp >= expForLevel(rpg.level)){
    rpg.exp -= expForLevel(rpg.level);
    rpg.level++;
    leveledUp = true;
  }
  if(monsterDefeated){
    rpg.monsters[monster.id] = (rpg.monsters[monster.id] || 0) + 1;
  }
  await saveRpgData(staff, rpg);
  renderRpgResult(monster, expGain, rpg, monsterDefeated, leveledUp);
}

function renderRpgResult(monster, expGain, rpg, monsterDefeated, leveledUp){
  const box = document.getElementById("rpgResultBox");
  if(!box) return;
  const need = expForLevel(rpg.level);
  const pct = Math.min(100, Math.round((rpg.exp / need) * 100));
  box.innerHTML =
    '<div class="rpg-box">'
    + '<div class="rpg-box-head">'
    +   '<span style="font-size:30px;">'+monster.emoji+'</span>'
    +   '<span style="font-size:13px; font-weight:700;">'+monster.name+'を'+(monsterDefeated ? "たおした!" : "にがした…")+'</span>'
    + '</div>'
    + '<div style="font-size:11.5px; color:var(--sub); margin-bottom:4px;">Lv.'+rpg.level+'　EXP '+rpg.exp+' / '+need+'　(+'+expGain+')</div>'
    + '<div class="exp-bar"><div class="exp-bar-fill" style="width:'+pct+'%;"></div></div>'
    + (leveledUp ? '<div style="margin-top:8px; font-size:13px; font-weight:800; color:var(--seal-dark); text-align:center;">🎉 レベルアップ！</div>' : '')
    + '</div>';
}

async function computeStreak(staff){
  const all = (await getAllRecords()).filter(r => r.staff === staff);
  const byDate = {};
  all.forEach(r => { byDate[r.date] = byDate[r.date] || r.correct === r.total; if(r.correct === r.total) byDate[r.date] = true; });
  let streak = 0;
  let cursor = new Date();
  for(;;){
    const key = cursor.getFullYear()+"-"+String(cursor.getMonth()+1).padStart(2,"0")+"-"+String(cursor.getDate()).padStart(2,"0");
    if(byDate[key]){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  return streak;
}

function scoreForRecords(recs){
  if(recs.length === 0) return null;
  const totalCorrect = recs.reduce((s,r) => s + r.correct, 0);
  const totalQ = recs.reduce((s,r) => s + r.total, 0);
  return totalQ ? Math.round((totalCorrect/totalQ) * 100) : 0;
}

function renderCalendarCell(day, dateStr, recs){
  if(!recs || recs.length === 0) return '<div class="cal-cell"><span class="cal-day">'+day+'</span></div>';
  const score = scoreForRecords(recs);
  return '<div class="cal-cell has-record" onclick="showDayDetail(\''+dateStr+'\')"><span class="cal-day">'+day+'</span><span class="cal-score">'+score+'</span></div>';
}

function renderCalendar(){
  const wrap = document.getElementById("historyCalendar");
  const y = historyMonthCursor.getFullYear();
  const m = historyMonthCursor.getMonth();
  const startWeekday = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let html = '<div class="cal-nav"><button onclick="changeHistoryMonth(-1)">←</button><span class="cal-month-label">'+y+"年"+(m+1)+'月</span><button onclick="changeHistoryMonth(1)">→</button></div><div class="cal-grid">';
  ["日","月","火","水","木","金","土"].forEach(w => html += '<div class="cal-dow">'+w+'</div>');
  for(let i=0;i<startWeekday;i++) html += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    html += renderCalendarCell(d, dateStr, recordsByDate[dateStr]);
  }
  html += '</div>';
  wrap.innerHTML = html;
}

function changeHistoryMonth(delta){
  historyMonthCursor.setMonth(historyMonthCursor.getMonth() + delta);
  renderCalendar();
}

async function showDayDetail(dateStr){
  const recs = recordsByDate[dateStr];
  if(!recs) return;
  const lines = [dateStr];
  recs.forEach(r => lines.push(r.staff+"("+r.subject+"): "+r.correct+"/"+r.total));
  alert(lines.join("\n"));
  if(confirm("この日の記録を削除しますか?")){
    const tx = db.transaction(STORE, "readwrite");
    recs.forEach(r => tx.objectStore(STORE).delete(r.id));
    await new Promise(res => tx.oncomplete = res);
    delete recordsByDate[dateStr];
    renderCalendar();
  }
}

async function showHistory(){
  const staff = currentStaffName();
  const all = (await getAllRecords()).filter(r => !staff || r.staff === staff);
  recordsByDate = {};
  all.forEach(r => { (recordsByDate[r.date] = recordsByDate[r.date] || []).push(r); });
  historyMonthCursor = new Date();
  renderCalendar();
  const list = document.getElementById("historyList");
  const sorted = all.slice().sort((a,b) => b.savedAt.localeCompare(a.savedAt));
  if(sorted.length === 0){
    list.innerHTML = '<p style="color:var(--sub);font-size:14px;">まだ記録がありません。</p>';
  } else {
    list.innerHTML = sorted.slice(0,20).map(r =>
      '<div class="row"><span>'+r.date+' ・'+r.staff+'・'+(r.subject==="kanji"?"漢字":"算数")+'</span><span class="points-pill">'+r.correct+'/'+r.total+'</span></div>'
    ).join("");
  }
  showScreen("history");
}

function showSettings(){
  const sw = document.getElementById("themeSwatches");
  getSetting("theme").then(theme => {
    theme = theme || "fresh";
    sw.innerHTML = Object.keys(THEMES).map(key =>
      '<div class="swatch'+(key===theme?' active':'')+'" style="background:'+THEMES[key].swatch+';" title="'+THEMES[key].name+'" onclick="applyTheme(\''+key+'\')"></div>'
    ).join("");
  });
  renderStaffThemeList();
  renderMonsterDex();
  getStaffPointsSummary().then(rows => {
    const el = document.getElementById("staffPointsList");
    if(rows.length === 0){
      el.innerHTML = '<p style="color:var(--sub); font-size:13px;">まだ登録されていません。</p>';
    } else {
      rows.sort((a,b) => b.points - a.points || b.stars - a.stars);
      el.innerHTML = rows.map(r =>
        '<div class="row"><span>'+r.name+'</span>'
        + '<span style="display:flex; align-items:center; gap:6px;">'
        + '<span class="points-pill">'+r.points+'pt(☆'+r.stars+')</span>'
        + '<button onclick="removeStaff(\''+r.name+'\')" style="width:30px; height:30px; padding:0; border-radius:8px; flex-shrink:0;">✕</button>'
        + '</span></div>'
      ).join("");
    }
  });
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-settings").classList.add("active");
}

async function renderStaffThemeList(){
  const el = document.getElementById("staffThemeList");
  const list = await getStaffList();
  if(list.length === 0){
    el.innerHTML = '<p style="color:var(--sub); font-size:13px;">まだ登録されていません。</p>';
    return;
  }
  const rows = await Promise.all(list.map(async name => {
    const theme = (await getStaffTheme(name)) || "";
    const swatches = Object.keys(THEMES).map(key =>
      '<div class="swatch" style="width:26px;height:26px;background:'+THEMES[key].swatch+';'+(key===theme?'border-color:var(--ink);':'')+'" title="'+THEMES[key].name+'" onclick="applyStaffTheme(\''+name+'\',\''+key+'\')"></div>'
    ).join("");
    return '<div style="margin-bottom:10px;"><div style="font-size:13px; margin-bottom:6px;">'+name+'</div><div class="swatches" style="margin:0; gap:8px;">'+swatches+'</div></div>';
  }));
  el.innerHTML = rows.join("");
}

async function renderMonsterDex(){
  const el = document.getElementById("monsterDex");
  if(!el) return;
  const staff = currentStaffName();
  if(!staff){
    el.innerHTML = '<p style="color:var(--sub); font-size:13px;">こどもを選ぶと表示されます。</p>';
    return;
  }
  const rpg = await getRpgData(staff);
  el.innerHTML = MONSTER_BANK.map(m => {
    const count = rpg.monsters[m.id] || 0;
    const caught = count > 0;
    return '<div class="dex-item" style="opacity:'+(caught ? 1 : 0.35)+';">'
      + '<div style="font-size:26px;">'+(caught ? m.emoji : "❔")+'</div>'
      + '<div style="font-size:9.5px; color:var(--sub); margin-top:2px;">'+(caught ? m.name : "？？？")+'</div>'
      + (caught ? '<div style="font-size:9px; color:var(--sub);">×'+count+'</div>' : '')
      + '</div>';
  }).join("");
}

async function exportData(){
  const [records, settings] = await Promise.all([getAllRecords(), getAllSettingsEntries()]);
  const payload = { app: "study-quiz-app", version: 1, exportedAt: new Date().toISOString(), settings, records };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "study-quiz-backup-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

async function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!confirm("バックアップから復元します。同じ設定は上書きされます。よろしいですか?")){
    event.target.value = "";
    return;
  }
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!Array.isArray(payload.settings) || !Array.isArray(payload.records)) throw new Error("invalid format");
    const stx = db.transaction(SETTINGS, "readwrite");
    payload.settings.forEach(s => stx.objectStore(SETTINGS).put(s));
    await new Promise(res => stx.oncomplete = res);
    const rtx = db.transaction(STORE, "readwrite");
    payload.records.forEach(r => rtx.objectStore(STORE).put(r));
    await new Promise(res => rtx.oncomplete = res);
    alert("インポートが完了しました。");
    location.reload();
  } catch(err){
    alert("インポートに失敗しました。ファイルの形式を確認してください。");
  }
  event.target.value = "";
}

function showScreen(name){
  ["home","quiz","result","history","settings"].forEach(n => {
    document.getElementById("screen-"+n).classList.toggle("active", n===name);
  });
  ["home","quiz","result","history"].forEach(n => {
    const dot = document.getElementById("dot-"+n);
    if(dot) dot.classList.toggle("active", n===name);
  });
}

function updateNetStatus(){
  const el = document.getElementById("netStatus");
  el.textContent = navigator.onLine
    ? "オンライン(データは端末内に保存されます)"
    : "オフラインです。電波が戻り次第、自動で反映されます。";
}

window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);

(async function init(){
  updateNetStatus();
  db = await openDB();
  renderGradeSelect();
  const theme = await getSetting("theme") || "fresh";
  setThemeVars(theme);
  if((await getStaffList()).length === 0){
    await putSetting("staffList", ["サンプル1"]);
  }
  await renderStaffSelect();
  await refreshStarsRow();
  await applyThemeForCurrentStaff();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
