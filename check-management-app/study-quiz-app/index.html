<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>まいにち小テスト</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#12483B" />
<style>
  :root{
    --bg:#EAF3F2; --card:#FFFFFF; --paper:#F3FAF9; --ink:#173D3A; --sub:#5C7A77;
    --seal:#1D7A8C; --seal-dark:#125866; --teal:#1D9E75; --teal-dark:#0F6E56;
    --border:#D8ECE9; --border-strong:#BFDFDA; --warn:#8A5A16; --warn-bg:#F6E8CE;
    --wrong:#B23B2E; --wrong-bg:#FBEAE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Kaku Gothic ProN","Zen Kaku Gothic New",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center; min-height:100vh;
  }
  .phone{width:100%; max-width:420px; padding:16px;}
  .card{
    background:var(--card); border-radius:26px; padding:26px 22px 28px; min-height:80vh;
    display:flex; flex-direction:column;
    box-shadow:0 1px 2px rgba(23,61,58,0.06), 0 10px 30px rgba(23,61,58,0.09);
    border:1px solid var(--border);
  }
  .screen{display:none; flex-direction:column; flex:1;}
  .screen.active{display:flex;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .gear{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border-strong); background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:15px;
  }
  .eyebrow{font-size:12.5px; color:var(--sub); margin:0 0 5px; letter-spacing:0.06em;}
  h1{font-size:21px; margin:0 0 10px; font-weight:700; color:var(--ink); position:relative; padding-bottom:12px;}
  h1::after{content:""; position:absolute; left:0; bottom:0; width:40px; height:2px; background:linear-gradient(90deg, var(--seal), transparent);}
  select{width:100%; font-size:15px; padding:12px; border-radius:12px; border:1px solid var(--border-strong); font-family:inherit; background:var(--paper); color:var(--ink); margin-bottom:12px;}
  button{font-family:inherit; border-radius:12px; border:1px solid var(--border-strong); background:transparent; font-size:14.5px; padding:12px; cursor:pointer; color:var(--ink); transition:background 0.15s ease;}
  button:hover{background:var(--paper);}
  button:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal); color:#fff; border:none; font-size:17px; font-weight:700; height:56px; margin-top:auto; border-radius:999px; box-shadow:0 6px 16px rgba(29,158,117,0.28);}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-plain{margin-top:10px; height:44px; border-radius:999px;}
  .center{text-align:center; align-items:center; justify-content:center;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--border); font-size:14px; gap:8px;}
  .staff-add-row{display:none; gap:8px; margin:-8px 0 12px;}
  .staff-add-row input{flex:1; font-size:14px; padding:9px 10px; border-radius:10px; border:1px solid var(--border-strong); font-family:inherit; background:var(--paper); color:var(--ink);}
  .progress{font-size:12px; color:var(--sub); margin-bottom:8px;}
  .q-card{background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:26px 18px; text-align:center; margin-bottom:18px;}
  .q-kanji{font-size:56px; font-weight:700; line-height:1;}
  .q-math{font-size:34px; font-weight:700; letter-spacing:2px;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choice-btn{padding:16px 8px; border-radius:12px; font-size:17px; font-weight:700; background:var(--card); border:1.5px solid var(--border-strong);}
  .choice-btn.correct{background:var(--paper); border-color:var(--teal); color:var(--teal-dark);}
  .choice-btn.wrong{background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong);}
  .choice-btn:disabled{cursor:default;}
  .circle{
    width:104px; height:104px; border-radius:50%; border:3px solid var(--teal); color:var(--teal-dark);
    display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:22px;
    font-size:30px; font-weight:800; box-shadow:0 4px 12px rgba(29,158,117,0.2);
  }
  .stars-icons{display:flex; gap:2px; font-size:18px; letter-spacing:1px; justify-content:center; margin-bottom:6px;}
  .star-on{color:var(--seal);}
  .star-off{color:var(--border-strong);}
  .points-pill{font-size:11.5px; font-weight:700; background:var(--paper); color:var(--sub); border:1px solid var(--border); padding:4px 11px; border-radius:999px; white-space:nowrap;}
  .swatches{display:flex; gap:14px; margin:6px 0 22px; flex-wrap:wrap;}
  .swatch{width:48px; height:48px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,0.12);}
  .swatch.active{border-color:var(--ink);}
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-nav button{padding:6px 14px; font-size:14px; border-radius:999px;}
  .cal-month-label{font-size:15px; font-weight:700; color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-dow{font-size:11px; color:var(--sub); text-align:center; padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1; min-width:0; overflow:hidden; border-radius:10px; border:1px solid var(--border);
    background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; font-size:11px; color:var(--sub);
  }
  .cal-cell.empty{border:none; background:transparent;}
  .cal-cell.has-record{border-color:var(--border-strong); cursor:pointer;}
  .cal-day{font-size:10px; color:var(--sub); position:absolute; top:3px; left:5px;}
  .cal-score{font-size:14px; font-weight:700; color:var(--teal);}
  .dots{display:flex; justify-content:center; gap:8px; margin-top:14px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--border-strong);}
  .dot.active{background:var(--teal);}
  .offline-note{font-size:11.5px; color:var(--sub); text-align:center; margin-top:10px;}
  .sub-note{font-size:11.5px; color:var(--sub); line-height:1.6; margin:0 0 10px;}
</style>
</head>
<body>
<div class="phone">
  <div class="card">

    <section id="screen-home" class="screen active">
      <div class="topbar">
        <div>
          <p class="eyebrow">まいにち5分</p>
          <h1 style="margin-bottom:0; padding-bottom:0;">小テスト</h1>
        </div>
        <div class="gear" onclick="showSettings()">⚙</div>
      </div>

      <p class="eyebrow" style="margin-top:14px;">だれがやる？</p>
      <select id="staffSelect" onchange="handleStaffChange()"></select>
      <div class="staff-add-row" id="staffAddRow">
        <input id="staffAddInput" type="text" placeholder="なまえを入力" onkeydown="if(event.key==='Enter') confirmAddStaff();" />
        <button onclick="confirmAddStaff()" style="width:56px; flex-shrink:0;">追加</button>
      </div>
      <div class="stars-icons" id="starsRow"></div>

      <p class="eyebrow" style="margin-top:10px;">がくねん</p>
      <select id="gradeSelect"></select>

      <p class="eyebrow" style="margin-top:2px;">きょうか</p>
      <select id="subjectSelect">
        <option value="kanji">漢字</option>
        <option value="math">算数</option>
      </select>

      <button class="btn-primary" onclick="startQuiz()">はじめる(5問)</button>
      <button class="btn-plain" onclick="showHistory()">記録一覧を見る</button>
      <p class="offline-note" id="netStatus"></p>
    </section>

    <section id="screen-quiz" class="screen">
      <p class="progress" id="quizProgress"></p>
      <div class="q-card" id="quizQuestionArea"></div>
      <div class="choices" id="quizChoices"></div>
    </section>

    <section id="screen-result" class="screen center">
      <div class="circle" id="resultCircle"></div>
      <p style="font-size:18px;font-weight:700;margin:0 0 8px;" id="resultLabel"></p>
      <p style="font-size:13px;color:var(--sub);margin:0 0 14px;" id="streakLabel"></p>
      <div style="margin-bottom:10px;">
        <div class="stars-icons" id="starsRowDone"></div>
        <div style="text-align:center;"><span class="points-pill" id="pointsDone"></span></div>
      </div>
      <button class="btn-plain" style="width:100%;" onclick="showScreen('home')">もういちどトップへ →</button>
    </section>

    <section id="screen-history" class="screen">
      <p class="eyebrow">記録一覧</p>
      <h1>これまでの記録</h1>
      <div id="historyCalendar" style="margin-bottom:18px;"></div>
      <div id="historyList"></div>
      <button class="btn-plain" onclick="showScreen('home')">トップに戻る</button>
    </section>

    <section id="screen-settings" class="screen">
      <p class="eyebrow">設定</p>
      <h1>デザインを選ぶ</h1>
      <p class="eyebrow" style="margin-top:0;">既定の配色</p>
      <div class="swatches" id="themeSwatches"></div>
      <p class="eyebrow" style="margin-top:8px;">こどもごとの配色</p>
      <div id="staffThemeList" style="margin-bottom:6px;"></div>
      <p class="eyebrow" style="margin-top:12px;">こどもごとのポイント</p>
      <div id="staffPointsList"></div>
      <p class="eyebrow" style="margin-top:12px;">データのバックアップ</p>
      <p class="sub-note">データは端末内にのみ保存されています。機種変更やブラウザのデータ消去に備えて、定期的にバックアップをおすすめします。</p>
      <div style="display:flex; gap:8px; margin-bottom:6px;">
        <button onclick="exportData()" style="flex:1;">📤 エクスポート</button>
        <button onclick="document.getElementById('importFileInput').click()" style="flex:1;">📥 インポート</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportFile(event)" />
      <p class="eyebrow" style="margin-top:12px;">ほかのアプリ</p>
      <a href="../swing-trade-app/" style="display:block; text-align:center; text-decoration:none; color:var(--teal); font-size:13px; padding:12px; border:1px solid var(--border-strong); border-radius:12px; margin-bottom:6px;">📈 スイングトレード チェックへ</a>
      <button class="btn-plain" onclick="showScreen('home')">戻る</button>
    </section>

    <div class="dots">
      <span class="dot active" id="dot-home"></span>
      <span class="dot" id="dot-quiz"></span>
      <span class="dot" id="dot-result"></span>
      <span class="dot" id="dot-history"></span>
    </div>
  </div>
</div>

<script>
const DB_NAME = "studyQuizAppDB", STORE = "records", SETTINGS = "settings";

const GRADES = [
  { key: "g1", label: "小学1年生" },
  { key: "g2", label: "小学2年生" },
  { key: "g3", label: "小学3年生" }
];

// 教育漢字のうち、単独字カードとして読みが分かりやすいものを抜粋。
// 学年を追加する場合はここにキーを増やすだけでよい。
const KANJI_BANK = {
  g1: [
    ["一","いち"],["二","に"],["三","さん"],["四","し"],["五","ご"],
    ["六","ろく"],["七","しち"],["八","はち"],["九","きゅう"],["十","じゅう"],
    ["日","ひ"],["月","つき"],["水","みず"],["木","き"],["山","やま"]
  ],
  g2: [
    ["春","はる"],["夏","なつ"],["秋","あき"],["冬","ふゆ"],["東","ひがし"],
    ["西","にし"],["南","みなみ"],["北","きた"],["友","とも"],["兄","あに"],
    ["姉","あね"],["弟","おとうと"],["妹","いもうと"],["数","かず"],["何","なに"]
  ],
  g3: [
    ["去","きょ"],["急","きゅう"],["級","きゅう"],["球","きゅう"],["銀","ぎん"],
    ["区","く"],["苦","く"],["具","ぐ"],["君","くん"],["係","けい"],
    ["軽","けい"],["血","けつ"],["決","けつ"],["研","けん"],["県","けん"]
  ]
};

const THEMES = {
  fresh: { name:"さわやか", swatch:"#1D9E75", bg:"#EAF3F2", card:"#FFFFFF", paper:"#F3FAF9", ink:"#173D3A", sub:"#5C7A77", seal:"#1D7A8C", sealDark:"#125866", teal:"#1D9E75", tealDark:"#0F6E56", border:"#D8ECE9", borderStrong:"#BFDFDA" },
  sunset: { name:"サンセット", swatch:"linear-gradient(135deg,#FDEADB,#F6C9A0 50%,#E8927A)", bg:"#F8E4D6", card:"#FFF9F2", paper:"#FFFFFF", ink:"#4A2A1E", sub:"#8A6152", seal:"#B23B2E", sealDark:"#8B2A20", teal:"#6B2E3B", tealDark:"#4E1F29", border:"#EFD9C4", borderStrong:"#E3C1A2" },
  ocean: { name:"オーシャン", swatch:"linear-gradient(135deg,#E3F3F7,#9FD3DE 50%,#4E93A8)", bg:"#DDEFF3", card:"#FBFEFF", paper:"#FFFFFF", ink:"#123B45", sub:"#4E7480", seal:"#B23B2E", sealDark:"#8B2A20", teal:"#175E70", tealDark:"#0F4552", border:"#D2ECEF", borderStrong:"#B7DEE3" },
  lavender: { name:"ラベンダー", swatch:"linear-gradient(135deg,#F2ECFB,#D9C8F0 50%,#B79EE0)", bg:"#EAE1F7", card:"#FCFAFF", paper:"#FFFFFF", ink:"#3A2A55", sub:"#79658F", seal:"#C23B6E", sealDark:"#8F2650", teal:"#4B2E7A", tealDark:"#37205C", border:"#E4D6F5", borderStrong:"#D3BEEF" },
  gold: { name:"ゴールド", swatch:"linear-gradient(135deg,#FBF3DE,#F0DDA6 50%,#E0C177)", bg:"#F3E9CC", card:"#FFFCF3", paper:"#FFFFFF", ink:"#3A2E14", sub:"#8A7A52", seal:"#8B6914", sealDark:"#6B4F0F", teal:"#7A5B1E", tealDark:"#5C440F", border:"#EEDFB0", borderStrong:"#E0CB8A" }
};

let db;
let currentQuiz = { staff: "", grade: "g1", subject: "kanji", questions: [], index: 0, correct: 0 };
let historyMonthCursor = new Date(), recordsByDate = {};

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
      if(!d.objectStoreNames.contains(SETTINGS)) d.createObjectStore(SETTINGS, { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getSetting(key){
  return new Promise((resolve) => {
    const tx = db.transaction(SETTINGS, "readonly");
    const req = tx.objectStore(SETTINGS).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
  });
}

function putSetting(key, value){
  return new Promise((resolve) => {
    const tx = db.transaction(SETTINGS, "readwrite");
    tx.objectStore(SETTINGS).put({ key, value });
    tx.oncomplete = () => resolve();
  });
}

function getAllRecords(){
  return new Promise((resolve) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
  });
}

function getAllSettingsEntries(){
  return new Promise((resolve) => {
    const tx = db.transaction(SETTINGS, "readonly");
    const req = tx.objectStore(SETTINGS).getAll();
    req.onsuccess = () => resolve(req.result);
  });
}

async function getStaffList(){
  return (await getSetting("staffList")) || [];
}

async function renderStaffSelect(){
  const list = await getStaffList();
  const sel = document.getElementById("staffSelect");
  const prevValue = sel.value;
  let opts = '<option value="">選んでください</option>';
  opts += list.map(name => '<option value="'+name+'">'+name+'</option>').join("");
  opts += '<option value="__add__">+ 新しい名前を追加</option>';
  sel.innerHTML = opts;
  if(list.includes(prevValue)) sel.value = prevValue;
  else if(list.length) sel.value = list[0];
  document.getElementById("staffAddRow").style.display = "none";
}

function currentStaffName(){
  const sel = document.getElementById("staffSelect");
  const v = sel ? sel.value : "";
  return (v === "__add__") ? "" : v;
}

async function handleStaffChange(){
  const sel = document.getElementById("staffSelect");
  const addRow = document.getElementById("staffAddRow");
  if(sel.value === "__add__"){
    addRow.style.display = "flex";
    document.getElementById("staffAddInput").value = "";
    document.getElementById("staffAddInput").focus();
  } else {
    addRow.style.display = "none";
  }
  await refreshStarsRow();
  await applyThemeForCurrentStaff();
}

async function confirmAddStaff(){
  const input = document.getElementById("staffAddInput");
  const name = input.value.trim();
  if(!name) return;
  const list = await getStaffList();
  if(!list.includes(name)) list.push(name);
  await putSetting("staffList", list);
  await renderStaffSelect();
  document.getElementById("staffSelect").value = name;
  document.getElementById("staffAddRow").style.display = "none";
  await refreshStarsRow();
  await applyThemeForCurrentStaff();
}

async function removeStaff(name){
  if(!confirm(name+'を削除します。よろしいですか?(記録済みの過去データは残ります)')) return;
  const list = (await getStaffList()).filter(n => n !== name);
  await putSetting("staffList", list);
  await renderStaffSelect();
  await refreshStarsRow();
  await applyThemeForCurrentStaff();
  showSettings();
}

async function getStarsData(staffName){
  const data = await getSetting("stars:" + (staffName || "__none__"));
  return data || { stars: 0, points: 0 };
}

async function renderStars(elId, data){
  const el = document.getElementById(elId);
  if(!el) return;
  let icons = "";
  for(let i = 0; i < 10; i++){
    icons += '<span class="'+(i < data.stars ? "star-on" : "star-off")+'">'+(i < data.stars ? "★" : "☆")+'</span>';
  }
  el.innerHTML = icons;
}

async function refreshStarsRow(){
  const staff = currentStaffName();
  if(!staff){ document.getElementById("starsRow").innerHTML = ""; return; }
  const data = await getStarsData(staff);
  renderStars("starsRow", data);
}

async function addStarIfPassed(passed, staff){
  const data = await getStarsData(staff);
  if(!passed || !staff) return data;
  const lastKey = "lastStarDate:" + staff;
  const lastDate = await getSetting(lastKey);
  const today = todayStr();
  if(lastDate === today) return data;
  data.stars += 1;
  if(data.stars >= 10){ data.stars -= 10; data.points += 1; }
  await putSetting("stars:" + staff, data);
  await putSetting(lastKey, today);
  return data;
}

async function getStaffPointsSummary(){
  const list = await getStaffList();
  const rows = [];
  for(const name of list){
    const data = await getStarsData(name);
    rows.push({ name, points: data.points, stars: data.stars });
  }
  return rows;
}

function getStaffTheme(name){ return getSetting("staffTheme:" + name); }

async function applyStaffTheme(name, key){
  await putSetting("staffTheme:" + name, key);
  if(currentStaffName() === name) setThemeVars(key);
  showSettings();
}

async function applyThemeForCurrentStaff(){
  const staff = currentStaffName();
  if(staff){
    const theme = await getStaffTheme(staff);
    if(theme){ setThemeVars(theme); return; }
  }
  const defaultTheme = await getSetting("theme") || "fresh";
  setThemeVars(defaultTheme);
}

function setThemeVars(key){
  const t = THEMES[key] || THEMES.fresh;
  const root = document.documentElement.style;
  root.setProperty("--bg", t.bg);
  root.setProperty("--card", t.card);
  root.setProperty("--paper", t.paper);
  root.setProperty("--ink", t.ink);
  root.setProperty("--sub", t.sub);
  root.setProperty("--seal", t.seal);
  root.setProperty("--seal-dark", t.sealDark);
  root.setProperty("--teal", t.teal);
  root.setProperty("--teal-dark", t.tealDark);
  root.setProperty("--border", t.border);
  root.setProperty("--border-strong", t.borderStrong);
}

async function applyTheme(key){
  await putSetting("theme", key);
  setThemeVars(key);
  showSettings();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function renderGradeSelect(){
  const sel = document.getElementById("gradeSelect");
  sel.innerHTML = GRADES.map(g => '<option value="'+g.key+'">'+g.label+'</option>').join("");
}

function rnd(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }

function genMathProblem(gradeKey){
  const n = parseInt(gradeKey.replace("g",""), 10);
  if(n === 1){
    if(Math.random() < 0.5){
      const a = rnd(1,15), b = rnd(1,20-a);
      return { q: a+" + "+b, ans: a+b };
    }
    const a = rnd(1,20), b = rnd(0,a);
    return { q: a+" − "+b, ans: a-b };
  }
  if(n === 2){
    const r = Math.random();
    if(r < 0.34){ const a=rnd(10,80), b=rnd(10,99-a); return { q:a+" + "+b, ans:a+b }; }
    if(r < 0.67){ const a=rnd(20,99), b=rnd(0,a); return { q:a+" − "+b, ans:a-b }; }
    const a=rnd(1,9), b=rnd(1,9); return { q:a+" × "+b, ans:a*b };
  }
  // grade 3+
  const r = Math.random();
  if(r < 0.3){ const a=rnd(1,12), b=rnd(1,9); return { q:a+" × "+b, ans:a*b }; }
  if(r < 0.55){ const b=rnd(1,9), ansv=rnd(1,9); return { q:(b*ansv)+" ÷ "+b, ans:ansv }; }
  if(r < 0.78){ const a=rnd(100,800), b=rnd(100,999-a); return { q:a+" + "+b, ans:a+b }; }
  const a=rnd(200,999), b=rnd(0,a); return { q:a+" − "+b, ans:a-b };
}

function mathChoices(correct){
  const set = new Set([correct]);
  const deltas = [1,-1,2,-2,3,-3,5,-5,10,-10];
  let i = 0;
  while(set.size < 4 && i < deltas.length){
    const v = correct + deltas[i];
    if(v >= 0) set.add(v);
    i++;
  }
  while(set.size < 4) set.add(correct + rnd(1,20));
  return shuffle([...set]);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions(gradeKey, subject){
  const qs = [];
  if(subject === "kanji"){
    const bank = shuffle(KANJI_BANK[gradeKey] || KANJI_BANK.g1).slice(0, 5);
    const allReadings = (KANJI_BANK[gradeKey] || KANJI_BANK.g1).map(k => k[1]);
    bank.forEach(([kanji, reading]) => {
      const distractors = shuffle(allReadings.filter(r => r !== reading)).slice(0, 3);
      const choices = shuffle([reading, ...distractors]);
      qs.push({ type: "kanji", display: kanji, ans: reading, choices });
    });
  } else {
    for(let i = 0; i < 5; i++){
      const p = genMathProblem(gradeKey);
      qs.push({ type: "math", display: p.q, ans: p.ans, choices: mathChoices(p.ans) });
    }
  }
  return qs;
}

function startQuiz(){
  const staff = currentStaffName();
  if(!staff){ alert("だれがやるか選んでください(なければ「+新しい名前を追加」)"); return; }
  const grade = document.getElementById("gradeSelect").value;
  const subject = document.getElementById("subjectSelect").value;
  currentQuiz = { staff, grade, subject, questions: buildQuestions(grade, subject), index: 0, correct: 0 };
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion(){
  const q = currentQuiz.questions[currentQuiz.index];
  document.getElementById("quizProgress").textContent = (currentQuiz.index+1)+" / "+currentQuiz.questions.length+"問";
  const area = document.getElementById("quizQuestionArea");
  if(q.type === "kanji"){
    area.innerHTML = '<div class="q-kanji">'+q.display+'</div><div style="font-size:12px;color:var(--sub);margin-top:10px;">読み方はどれ?</div>';
  } else {
    area.innerHTML = '<div class="q-math">'+q.display+' = ?</div>';
  }
  const choicesEl = document.getElementById("quizChoices");
  choicesEl.innerHTML = q.choices.map((c,i) =>
    '<button class="choice-btn" onclick="answerQuiz('+i+')">'+c+'</button>'
  ).join("");
}

function answerQuiz(i){
  const q = currentQuiz.questions[currentQuiz.index];
  const chosen = q.choices[i];
  const buttons = document.querySelectorAll("#quizChoices .choice-btn");
  buttons.forEach(b => b.disabled = true);
  const isCorrect = chosen === q.ans;
  if(isCorrect){
    currentQuiz.correct++;
    buttons[i].classList.add("correct");
  } else {
    buttons[i].classList.add("wrong");
    buttons.forEach((b,bi) => { if(q.choices[bi] === q.ans) b.classList.add("correct"); });
  }
  setTimeout(() => {
    currentQuiz.index++;
    if(currentQuiz.index < currentQuiz.questions.length) renderQuestion();
    else finishQuiz();
  }, isCorrect ? 500 : 1100);
}

async function finishQuiz(){
  const { staff, grade, subject, correct, questions } = currentQuiz;
  const total = questions.length;
  const passed = correct === total;
  const date = todayStr();
  const record = { id: staff+"__"+subject+"__"+date+"__"+Date.now(), staff, grade, subject, date, correct, total, savedAt: new Date().toISOString() };

  const tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).put(record);
  await new Promise(res => tx.oncomplete = res);

  const streak = await computeStreak(staff);
  document.getElementById("resultCircle").textContent = correct+"/"+total;
  document.getElementById("resultLabel").textContent =
    passed ? "ぜんもんせいかい！すごい！" : correct >= total*0.6 ? "よくできました！" : "またちょうせんしよう！";
  document.getElementById("streakLabel").textContent = streak > 0 ? "連続"+streak+"日、記録できています" : "";

  const starsData = await addStarIfPassed(passed, staff);
  await renderStars("starsRowDone", starsData);
  document.getElementById("pointsDone").textContent = "ポイント "+starsData.points+"pt";

  showScreen("result");
}

async function computeStreak(staff){
  const all = (await getAllRecords()).filter(r => r.staff === staff);
  const byDate = {};
  all.forEach(r => { byDate[r.date] = byDate[r.date] || r.correct === r.total; if(r.correct === r.total) byDate[r.date] = true; });
  let streak = 0;
  let cursor = new Date();
  for(;;){
    const key = cursor.getFullYear()+"-"+String(cursor.getMonth()+1).padStart(2,"0")+"-"+String(cursor.getDate()).padStart(2,"0");
    if(byDate[key]){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  return streak;
}

function scoreForRecords(recs){
  if(recs.length === 0) return null;
  const totalCorrect = recs.reduce((s,r) => s + r.correct, 0);
  const totalQ = recs.reduce((s,r) => s + r.total, 0);
  return totalQ ? Math.round((totalCorrect/totalQ) * 100) : 0;
}

function renderCalendarCell(day, dateStr, recs){
  if(!recs || recs.length === 0) return '<div class="cal-cell"><span class="cal-day">'+day+'</span></div>';
  const score = scoreForRecords(recs);
  return '<div class="cal-cell has-record" onclick="showDayDetail(\''+dateStr+'\')"><span class="cal-day">'+day+'</span><span class="cal-score">'+score+'</span></div>';
}

function renderCalendar(){
  const wrap = document.getElementById("historyCalendar");
  const y = historyMonthCursor.getFullYear();
  const m = historyMonthCursor.getMonth();
  const startWeekday = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let html = '<div class="cal-nav"><button onclick="changeHistoryMonth(-1)">←</button><span class="cal-month-label">'+y+"年"+(m+1)+'月</span><button onclick="changeHistoryMonth(1)">→</button></div><div class="cal-grid">';
  ["日","月","火","水","木","金","土"].forEach(w => html += '<div class="cal-dow">'+w+'</div>');
  for(let i=0;i<startWeekday;i++) html += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    html += renderCalendarCell(d, dateStr, recordsByDate[dateStr]);
  }
  html += '</div>';
  wrap.innerHTML = html;
}

function changeHistoryMonth(delta){
  historyMonthCursor.setMonth(historyMonthCursor.getMonth() + delta);
  renderCalendar();
}

async function showDayDetail(dateStr){
  const recs = recordsByDate[dateStr];
  if(!recs) return;
  const lines = [dateStr];
  recs.forEach(r => lines.push(r.staff+"("+r.subject+"): "+r.correct+"/"+r.total));
  alert(lines.join("\n"));
  if(confirm("この日の記録を削除しますか?")){
    const tx = db.transaction(STORE, "readwrite");
    recs.forEach(r => tx.objectStore(STORE).delete(r.id));
    await new Promise(res => tx.oncomplete = res);
    delete recordsByDate[dateStr];
    renderCalendar();
  }
}

async function showHistory(){
  const staff = currentStaffName();
  const all = (await getAllRecords()).filter(r => !staff || r.staff === staff);
  recordsByDate = {};
  all.forEach(r => { (recordsByDate[r.date] = recordsByDate[r.date] || []).push(r); });
  historyMonthCursor = new Date();
  renderCalendar();
  const list = document.getElementById("historyList");
  const sorted = all.slice().sort((a,b) => b.savedAt.localeCompare(a.savedAt));
  if(sorted.length === 0){
    list.innerHTML = '<p style="color:var(--sub);font-size:14px;">まだ記録がありません。</p>';
  } else {
    list.innerHTML = sorted.slice(0,20).map(r =>
      '<div class="row"><span>'+r.date+' ・'+r.staff+'・'+(r.subject==="kanji"?"漢字":"算数")+'</span><span class="points-pill">'+r.correct+'/'+r.total+'</span></div>'
    ).join("");
  }
  showScreen("history");
}

function showSettings(){
  const sw = document.getElementById("themeSwatches");
  getSetting("theme").then(theme => {
    theme = theme || "fresh";
    sw.innerHTML = Object.keys(THEMES).map(key =>
      '<div class="swatch'+(key===theme?' active':'')+'" style="background:'+THEMES[key].swatch+';" title="'+THEMES[key].name+'" onclick="applyTheme(\''+key+'\')"></div>'
    ).join("");
  });
  renderStaffThemeList();
  getStaffPointsSummary().then(rows => {
    const el = document.getElementById("staffPointsList");
    if(rows.length === 0){
      el.innerHTML = '<p style="color:var(--sub); font-size:13px;">まだ登録されていません。</p>';
    } else {
      rows.sort((a,b) => b.points - a.points || b.stars - a.stars);
      el.innerHTML = rows.map(r =>
        '<div class="row"><span>'+r.name+'</span>'
        + '<span style="display:flex; align-items:center; gap:6px;">'
        + '<span class="points-pill">'+r.points+'pt(☆'+r.stars+')</span>'
        + '<button onclick="removeStaff(\''+r.name+'\')" style="width:30px; height:30px; padding:0; border-radius:8px; flex-shrink:0;">✕</button>'
        + '</span></div>'
      ).join("");
    }
  });
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-settings").classList.add("active");
}

async function renderStaffThemeList(){
  const el = document.getElementById("staffThemeList");
  const list = await getStaffList();
  if(list.length === 0){
    el.innerHTML = '<p style="color:var(--sub); font-size:13px;">まだ登録されていません。</p>';
    return;
  }
  const rows = await Promise.all(list.map(async name => {
    const theme = (await getStaffTheme(name)) || "";
    const swatches = Object.keys(THEMES).map(key =>
      '<div class="swatch" style="width:26px;height:26px;background:'+THEMES[key].swatch+';'+(key===theme?'border-color:var(--ink);':'')+'" title="'+THEMES[key].name+'" onclick="applyStaffTheme(\''+name+'\',\''+key+'\')"></div>'
    ).join("");
    return '<div style="margin-bottom:10px;"><div style="font-size:13px; margin-bottom:6px;">'+name+'</div><div class="swatches" style="margin:0; gap:8px;">'+swatches+'</div></div>';
  }));
  el.innerHTML = rows.join("");
}

async function exportData(){
  const [records, settings] = await Promise.all([getAllRecords(), getAllSettingsEntries()]);
  const payload = { app: "study-quiz-app", version: 1, exportedAt: new Date().toISOString(), settings, records };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "study-quiz-backup-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

async function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!confirm("バックアップから復元します。同じ設定は上書きされます。よろしいですか?")){
    event.target.value = "";
    return;
  }
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!Array.isArray(payload.settings) || !Array.isArray(payload.records)) throw new Error("invalid format");
    const stx = db.transaction(SETTINGS, "readwrite");
    payload.settings.forEach(s => stx.objectStore(SETTINGS).put(s));
    await new Promise(res => stx.oncomplete = res);
    const rtx = db.transaction(STORE, "readwrite");
    payload.records.forEach(r => rtx.objectStore(STORE).put(r));
    await new Promise(res => rtx.oncomplete = res);
    alert("インポートが完了しました。");
    location.reload();
  } catch(err){
    alert("インポートに失敗しました。ファイルの形式を確認してください。");
  }
  event.target.value = "";
}

function showScreen(name){
  ["home","quiz","result","history","settings"].forEach(n => {
    document.getElementById("screen-"+n).classList.toggle("active", n===name);
  });
  ["home","quiz","result","history"].forEach(n => {
    const dot = document.getElementById("dot-"+n);
    if(dot) dot.classList.toggle("active", n===name);
  });
}

function updateNetStatus(){
  const el = document.getElementById("netStatus");
  el.textContent = navigator.onLine
    ? "オンライン(データは端末内に保存されます)"
    : "オフラインです。電波が戻り次第、自動で反映されます。";
}

window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);

(async function init(){
  updateNetStatus();
  db = await openDB();
  renderGradeSelect();
  const theme = await getSetting("theme") || "fresh";
  setThemeVars(theme);
  await renderStaffSelect();
  await refreshStarsRow();
  await applyThemeForCurrentStaff();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
